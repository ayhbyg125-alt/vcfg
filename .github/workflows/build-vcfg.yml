name: Build VCFG PRX

on:
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - 'plugin/**'
      - 'discovery/**'
      - 'tools/**'
      - 'build.ps1'
      - 'config.example.json'
      - '.github/workflows/build-vcfg.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Python
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          python --version
          clang --version
          ld.lld --version

      - name: Download OpenOrbis PS4 Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4'
          $headers = @{ 'User-Agent' = 'vcfg-ci' }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'toolchain-llvm-18.tar.gz' } | Select-Object -First 1
          if (-not $asset) { throw 'OpenOrbis v0.5.4 toolchain-llvm-18.tar.gz not found' }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $dest = Join-Path $env:RUNNER_TEMP 'OpenOrbis'
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $archive
          New-Item -ItemType Directory -Force $dest | Out-Null
          tar -xzf $archive -C $dest

          $link = Get-ChildItem -Path $dest -Recurse -Filter 'link.x' | Select-Object -First 1
          if (-not $link) { throw 'OpenOrbis link.x not found after extraction' }

          $tc = $link.Directory.FullName
          "OO_PS4_TOOLCHAIN=$tc" >> $env:GITHUB_ENV
          Write-Host "OpenOrbis: $tc"

      - name: Build GoldHEN Plugin SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$env:RUNNER_TEMP\GoldHEN_Plugins_SDK"
          Set-Location "$env:RUNNER_TEMP\GoldHEN_Plugins_SDK"
          cmd /c build_static.bat
          if ($LASTEXITCODE -ne 0) { throw 'GoldHEN SDK build_static.bat failed' }
          if (-not (Test-Path 'libGoldHEN_Hook.a')) { throw 'libGoldHEN_Hook.a was not produced' }
          "GOLDHEN_SDK=$env:RUNNER_TEMP\GoldHEN_Plugins_SDK" >> $env:GITHUB_ENV

      - name: Create VCFG config
        shell: pwsh
        run: |
          $llvm = Split-Path (Get-Command clang.exe).Source
          $cfg = @{
            openorbis_toolchain = $env:OO_PS4_TOOLCHAIN
            goldhen_sdk = $env:GOLDHEN_SDK
            llvm_bin = $llvm
            llc_gfx700 = (Join-Path $llvm 'llc.exe')
            python = 'python'
            ps4_host = '127.0.0.1'
            ps4_ftp_port = 2121
            classic_prx = ''
            classic_bb_prx = ''
          } | ConvertTo-Json
          Set-Content -Path config.json -Value $cfg -Encoding UTF8
          Get-Content config.json

      - name: Build VCFG with upstream build.ps1
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Target plugin
          if ($LASTEXITCODE -ne 0) { throw 'VCFG build.ps1 failed' }
          if (-not (Test-Path 'build\vcfg\vcfg.prx')) { throw 'vcfg.prx was not produced' }

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: vcfg-custom-ui-prx
          path: |
            build/vcfg/vcfg.prx
            build/vcfg/vcfg.oelf
            build/vcfg/vcfg.elf
          if-no-files-found: error

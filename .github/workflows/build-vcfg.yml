name: Build VCFG PRX

on:
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - 'plugin/**'
      - 'discovery/**'
      - 'tools/**'
      - 'build.ps1'
      - 'config.example.json'
      - '.github/workflows/build-vcfg.yml'
      - 'build-vcfg-linux.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout VCFG
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm python3 python3-pip curl tar make
          clang --version
          ld.lld --version
          python3 --version

      - name: Download OpenOrbis v0.5.4
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -L --fail --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/v0.5.4.tar.gz -o "$RUNNER_TEMP/openorbis/v0.5.4.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis/v0.5.4.tar.gz" -C "$RUNNER_TEMP/openorbis"
          test -f "$RUNNER_TEMP/openorbis/link.x"
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/openorbis" >> "$GITHUB_ENV"

      - name: Build GoldHEN Plugin SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          make -C "$RUNNER_TEMP/GoldHEN_Plugins_SDK" clean all
          test -f "$RUNNER_TEMP/GoldHEN_Plugins_SDK/libGoldHEN_Hook.a"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"

      - name: Create Linux build config
        run: |
          cat > config.json <<EOF
          {
            "openorbis_toolchain": "$OO_PS4_TOOLCHAIN",
            "goldhen_sdk": "$GOLDHEN_SDK",
            "llvm_bin": "/usr/bin",
            "llc_gfx700": "/usr/bin/llc",
            "python": "python3"
          }
          EOF

      - name: Build modified VCFG
        run: |
          chmod +x build-vcfg-linux.sh
          ./build-vcfg-linux.sh

      - name: Upload VCFG PRX
        uses: actions/upload-artifact@v4
        with:
          name: vcfg-custom-ui-prx
          path: build/vcfg/vcfg.prx
          if-no-files-found: error
